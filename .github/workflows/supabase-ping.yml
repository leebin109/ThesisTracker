name: Supabase keep-alive ping

# Supabase free tier pauses projects after 7 days of inactivity.
# This workflow runs every 6 days to prevent that.
# Requires SUPABASE_URL and SUPABASE_ANON_KEY to be set as repository secrets.

on:
  schedule:
    - cron: '0 0 */6 * *'   # every 6 days at midnight UTC
  workflow_dispatch:          # manual trigger from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_data?select=id&limit=1")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status: $STATUS" && exit 1
          fi
